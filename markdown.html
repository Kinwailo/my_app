        const convertHtmlToMarkdown = (htmlString, fileName) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            
            let title = doc.querySelector('title')?.textContent?.trim() 
                     || doc.querySelector('h1')?.textContent?.trim() 
                     || fileName.replace(/\.[^/.]+$/, "") 
                     || 'Imported Note';

            function parseNode(node) {
                if (node.nodeType === Node.TEXT_NODE) return node.textContent.replace(/\s+/g, ' ');
                if (node.nodeType !== Node.ELEMENT_NODE) return '';

                const tag = node.tagName.toLowerCase();
                if (['script', 'style', 'head', 'meta', 'link'].includes(tag)) return '';

                if (tag === 'table') {
                    const rows = Array.from(node.querySelectorAll('tr')).filter(tr => tr.closest('table') === node);
                    if (rows.length === 0) return '';

                    let maxCols = 0;
                    const rowData = rows.map(tr => {
                        const cells = Array.from(tr.querySelectorAll('th, td')).filter(cell => cell.closest('tr') === tr);
                        const cellTexts = cells.map(cell => Array.from(cell.childNodes).map(parseNode).join('').replace(/\s*\n\s*/g, ' ').replace(/\|/g, '\\|').trim());
                        if (cellTexts.length > maxCols) maxCols = cellTexts.length;
                        return cellTexts;
                    });

                    if (maxCols === 0) return '';

                    let mdTable = '\n\n';
                    const headerCells = rowData[0] || [];
                    while (headerCells.length < maxCols) headerCells.push('');
                    mdTable += `| ${headerCells.join(' | ')} |\n| ${Array(maxCols).fill('---').join(' | ')} |\n`;

                    for (let i = 1; i < rowData.length; i++) {
                        const row = rowData[i];
                        while (row.length < maxCols) row.push('');
                        mdTable += `| ${row.join(' | ')} |\n`;
                    }

                    return mdTable + '\n\n';
                }

                let children = Array.from(node.childNodes).map(parseNode).join('');

                switch (tag) {
                    case 'h1': return `\n# ${children.trim()}\n\n`;
                    case 'h2': return `\n## ${children.trim()}\n\n`;
                    case 'h3': return `\n### ${children.trim()}\n\n`;
                    case 'h4': return `\n#### ${children.trim()}\n\n`;
                    case 'p': return `\n${children.trim()}\n\n`;
                    case 'strong': case 'b': return `**${children}**`;
                    case 'em': case 'i': return `*${children}*`;
                    case 'code': return `\`${children}\``;
                    case 'pre': return `\n\`\`\`\n${node.textContent.trim()}\n\`\`\`\n\n`;
                    case 'a': return `[${children.trim() || 'Link'}](${node.getAttribute('href') || '#'})`;
                    case 'li': return `- ${children.trim()}\n`;
                    case 'ul': case 'ol': return `\n${children}\n`;
                    case 'blockquote': return `\n> ${children.trim()}\n\n`;
                    case 'hr': return `\n---\n\n`;
                    default: return children;
                }
            }

            const markdown = parseNode(doc.body || doc.documentElement).replace(/\n{3,}/g, '\n\n').trim();
            return { title, content: markdown };
        };

        const buildTagTree = (tagList) => {
            const root = {};
            tagList.forEach(tag => {
                const parts = tag.split('/');
                let current = root;
                let fullPath = '';
                parts.forEach((part) => {
                    fullPath = fullPath ? `${fullPath}/${part}` : part;
                    if (!current[part]) {
                        current[part] = { name: part, fullPath: fullPath, children: {} };
                    }
                    current = current[part].children;
                });
            });
            return root;
        };

            const t = I18N[lang] || I18N.zh;

            const [workspace, setWorkspace] = React.useState('local');
            const [fontSize, setFontSize] = React.useState(() => localStorage.getItem('zen_notes_font_size') || 'base');
            const [contentWidth, setContentWidth] = React.useState(() => localStorage.getItem('zen_notes_content_width') || 'normal');

            const [accessToken, setAccessToken] = React.useState(null);
            const [userInfo, setUserInfo] = React.useState(null);
            const [isSyncing, setIsSyncing] = React.useState(false);

            const cloudFileIdRef = React.useRef(null);
            const syncTimeoutRef = React.useRef(null);

            const [localNotes, setLocalNotes] = React.useState(() => {
                const saved = localStorage.getItem('zen_notes_local_data');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return DEFAULT_LOCAL_NOTES;
            });

            const [cloudNotes, setCloudNotes] = React.useState(DEFAULT_CLOUD_NOTES);

            const [activeLocalNoteId, setActiveLocalNoteId] = React.useState(() => localNotes[0]?.id || null);
            const [activeCloudNoteId, setActiveCloudNoteId] = React.useState(() => cloudNotes[0]?.id || null);

            const currentNotes = workspace === 'local' ? localNotes : cloudNotes;
            const activeNoteId = workspace === 'local' ? activeLocalNoteId : activeCloudNoteId;

            const setActiveNoteId = (id) => {
                if (workspace === 'local') setActiveLocalNoteId(id);
                else setActiveCloudNoteId(id);
            };

            const triggerCloudSave = (notesToSave, token) => {
                if (!token) return;
                setIsSyncing(true);
                if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
                syncTimeoutRef.current = setTimeout(() => {
                    saveCloudNotesToDrive(notesToSave, token);
                }, 1000);
            };

            const setNotes = (updater) => {
                if (workspace === 'local') {
                    setLocalNotes(prev => typeof updater === 'function' ? updater(prev) : updater);
                } else {
                    setCloudNotes(prev => {
                        const nextCloudNotes = typeof updater === 'function' ? updater(prev) : updater;
                        if (accessToken) {
                            triggerCloudSave(nextCloudNotes, accessToken);
                        }
                        return nextCloudNotes;
                    });
                }
            };

            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedTag, setSelectedTag] = React.useState(null);
            const [expandedTags, setExpandedTags] = React.useState({});
            const [viewMode, setViewMode] = React.useState('split');
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(true);
            const [isDarkMode, setIsDarkMode] = React.useState(() => {
                return localStorage.getItem('zen_notes_theme') === 'dark' || 
                       (!('zen_notes_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });
            const [isZenMode, setIsZenMode] = React.useState(false);
            const [showShortcutModal, setShowShortcutModal] = React.useState(false);
            const [showGDriveModal, setShowGDriveModal] = React.useState(false);
            const [notification, setNotification] = React.useState(null);

            const [newTagInput, setNewTagInput] = React.useState('');
            const [showTagAdder, setShowTagAdder] = React.useState(false);

            const searchInputRef = React.useRef(null);
            const textareaRef = React.useRef(null);

            React.useEffect(() => { localStorage.setItem('zen_notes_lang', lang); }, [lang]);
            React.useEffect(() => { localStorage.setItem('zen_notes_font_size', fontSize); }, [fontSize]);
            React.useEffect(() => { localStorage.setItem('zen_notes_content_width', contentWidth); }, [contentWidth]);
            React.useEffect(() => { localStorage.setItem('zen_notes_local_data', JSON.stringify(localNotes)); }, [localNotes]);

            React.useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('zen_notes_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('zen_notes_theme', 'light');
                }
            }, [isDarkMode]);

            const showToast = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 2500);
            };

            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    const isMod = e.metaKey || e.ctrlKey;
                    if (isMod && e.key.toLowerCase() === 'n') {
                        e.preventDefault();
                        createNewNote();
                    } else if ((isMod && e.key.toLowerCase() === 'f') || (e.key === '/' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT')) {
                        e.preventDefault();
                        searchInputRef.current?.focus();
                    } else if (isMod && e.key.toLowerCase() === 'e') {
                        e.preventDefault();
                        setViewMode(prev => prev === 'edit' ? 'split' : prev === 'split' ? 'preview' : 'edit');
                    } else if (isMod && e.shiftKey && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        setIsZenMode(prev => !prev);
                    } else if (e.key === 'Escape') {
                        if (isZenMode) setIsZenMode(false);
                        if (showShortcutModal) setShowShortcutModal(false);
                        if (showGDriveModal) setShowGDriveModal(false);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isZenMode, showShortcutModal, showGDriveModal, workspace, localNotes, cloudNotes]);

            const activeNote = currentNotes.find(n => n.id === activeNoteId) || currentNotes[0];

            const createNewNote = () => {
                const newNote = {
                    id: 'note-' + Date.now(),
                    title: t.newNote,
                    content: '',
                    tags: selectedTag ? [selectedTag] : [],
                    isPinned: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                };
                setNotes(prev => [newNote, ...prev]);
                setActiveNoteId(newNote.id);
                showToast(`${t.newNote} (${workspace === 'local' ? t.local : t.cloud})`);
                setTimeout(() => textareaRef.current?.focus(), 100);
            };

            const updateActiveNote = (updates) => {
                if (!activeNote) return;
                setNotes(prev => prev.map(note => {
                    if (note.id === activeNote.id) {
                        return { ...note, ...updates, updatedAt: Date.now() };
                    }
                    return note;
                }));
            };

            const deleteNote = (id, e) => {
                if (e) e.stopPropagation();
                const targetNote = currentNotes.find(n => n.id === id);
                if (!targetNote) return;

                const filtered = currentNotes.filter(n => n.id !== id);
                setNotes(filtered);

                if (activeNoteId === id) {
                    setActiveNoteId(filtered[0]?.id || null);
                }
                showToast(`${t.deleted}：「${targetNote.title || 'Note'}」`);
            };

            const togglePinNote = (id, e) => {
                if (e) e.stopPropagation();
                setNotes(prev => prev.map(n => n.id === id ? { ...n, isPinned: !n.isPinned } : n));
            };

            const exportNoteAsMarkdown = (noteToExport, e) => {
                if (e) e.stopPropagation();
                const note = noteToExport || activeNote;
                if (!note) return;
                const blob = new Blob([note.content], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${note.title || 'note'}.md`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const copyNoteToOtherWorkspace = (noteToCopy, e) => {
                if (e) e.stopPropagation();
                const targetWorkspace = workspace === 'local' ? 'cloud' : 'local';
                const duplicatedNote = {
                    ...noteToCopy,
                    id: 'note-' + Date.now(),
                    title: `${noteToCopy.title || 'Untitled'} (${workspace === 'local' ? 'Cloud Copy' : 'Local Copy'})`,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };

                if (targetWorkspace === 'cloud') {
                    if (!accessToken) {
                        setShowGDriveModal(true);
                        return;
                    }
                    const nextCloudNotes = [duplicatedNote, ...cloudNotes];
                    setCloudNotes(nextCloudNotes);
                    saveCloudNotesToDrive(nextCloudNotes, accessToken);
                    showToast(t.copiedToCloud);
                } else {
                    setLocalNotes(prev => [duplicatedNote, ...prev]);
                    showToast(t.copiedToLocal);
                }
            };

            const handleAddTagToActiveNote = () => {
                if (!newTagInput.trim() || !activeNote) return;
                const cleanTag = newTagInput.trim().replace(/^\/+|\/+$/g, '');
                const currentTags = activeNote.tags || [];
                if (!currentTags.includes(cleanTag)) {
                    updateActiveNote({ tags: [...currentTags, cleanTag] });
                }
                setNewTagInput('');
                setShowTagAdder(false);
            };

            const handleRemoveTagFromActiveNote = (tagToRemove) => {
                if (!activeNote) return;
                const updatedTags = (activeNote.tags || []).filter(t => t !== tagToRemove);
                updateActiveNote({ tags: updatedTags });
            };

            const handleImportHtml = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const htmlContent = e.target.result;
                        const { title, content } = convertHtmlToMarkdown(htmlContent, file.name);

                        const newNote = {
                            id: 'note-' + Date.now(),
                            title: title,
                            content: content,
                            tags: selectedTag ? [selectedTag] : ['Imported'],
                            isPinned: false,
                            createdAt: Date.now(),
                            updatedAt: Date.now(),
                        };

                        setNotes(prev => [newNote, ...prev]);
                        setActiveNoteId(newNote.id);
                        showToast(`Imported: "${title}"`);
                    } catch (err) {
                        showToast(t.htmlImportFail);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const saveCloudNotesToDrive = async (notesToSave, token) => {
                if (!token) return;
                setIsSyncing(true);

                try {
                    let fileId = cloudFileIdRef.current;

                    if (!fileId) {
                        const query = encodeURIComponent("name='zen_notes_backup.json' and trashed=false");
                        const listRes = await fetch(
                            `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&orderBy=createdTime desc`,
                            { headers: { Authorization: `Bearer ${token}` } }
                        );

                        if (listRes.ok) {
                            const listData = await listRes.json();
                            if (listData.files && listData.files.length > 0) {
                                fileId = listData.files[0].id;
                                cloudFileIdRef.current = fileId;
                            }
                        }
                    }

                    const backupPayload = JSON.stringify({
                        appName: "ZenNotes",
                        version: "2.0",
                        updatedAt: Date.now(),
                        notes: notesToSave
                    }, null, 2);

                    if (fileId) {
                        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                            method: 'PATCH',
                            headers: {
                                Authorization: `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: backupPayload
                        });
                    } else {
                        const metadata = {
                            name: 'zen_notes_backup.json',
                            mimeType: 'application/json',
                            parents: ['appDataFolder']
                        };
                        const delimiter = 'zen_notes_boundary';
                        const multipartBody = 
                            `--${delimiter}\r\n` +
                            `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
                            `${JSON.stringify(metadata)}\r\n` +
                            `--${delimiter}\r\n` +
                            `Content-Type: application/json\r\n\r\n` +
                            `${backupPayload}\r\n` +
                            `--${delimiter}--`;

                        const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: {
                                Authorization: `Bearer ${token}`,
                                'Content-Type': `multipart/related; boundary=${delimiter}`
                            },
                            body: multipartBody
                        });

                        if (createRes.ok) {
                            const createdData = await createRes.json();
                            cloudFileIdRef.current = createdData.id;
                        }
                    }
                } catch (err) {
                    console.error('Google Drive sync error:', err);
                    showToast(t.syncError);
                } finally {
                    setIsSyncing(false);
                }
            };

            const fetchCloudNotesFromDrive = async (token) => {
                setIsSyncing(true);

                try {
                    const query = encodeURIComponent("name='zen_notes_backup.json' and trashed=false");
                    const listRes = await fetch(
                        `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&orderBy=createdTime desc`,
                        { headers: { Authorization: `Bearer ${token}` } }
                    );

                    if (listRes.ok) {
                        const listData = await listRes.json();
                        const files = listData.files || [];

                        if (files.length > 0) {
                            const targetFile = files[0];
                            cloudFileIdRef.current = targetFile.id;

                            const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${targetFile.id}?alt=media`, {
                                headers: { Authorization: `Bearer ${token}` }
                            });

                            if (fileRes.ok) {
                                const backupData = await fileRes.json();
                                if (backupData && Array.isArray(backupData.notes) && backupData.notes.length > 0) {
                                    setCloudNotes(backupData.notes);
                                    setActiveCloudNoteId(backupData.notes[0]?.id || null);
                                    return;
                                }
                            }
                        }
                    }

                    // Default initialization if no cloud note exists yet
                    const newAccountDefaultNotes = DEFAULT_CLOUD_NOTES.map(note => ({
                        ...note,
                        id: 'cloud-' + Date.now(),
                        updatedAt: Date.now()
                    }));
                    setCloudNotes(newAccountDefaultNotes);
                    setActiveCloudNoteId(newAccountDefaultNotes[0]?.id || null);
                    await saveCloudNotesToDrive(newAccountDefaultNotes, token);

                } catch (err) {
                    console.error('Fetch cloud notes failed:', err);
                    showToast(t.syncError);
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleGoogleLogin = () => {
                if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
                    showToast('Google OAuth 載入中，請稍微重試');
                    return;
                }

                try {
                    const client = window.google.accounts.oauth2.initCodeClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                        ux_mode: 'popup',
                        callback: async (response) => {
                            if (response.error) {
                                showToast(`Login Failed: ${response.error}`);
                                return;
                            }
                            if (response.code) {
                                setIsSyncing(true);
                                try {
                                    const exchangeRes = await fetch(TOKEN_EXCHANGE_ENDPOINT, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ code: response.code })
                                    });
                                    const tokenData = await exchangeRes.json();
                                    const token = tokenData.access_token || tokenData.token;
                                    if (token) {
                                        setAccessToken(token);
                                        await fetchUserProfile(token);
                                        await fetchCloudNotesFromDrive(token);
                                        setWorkspace('cloud');
                                        showToast(t.switchedToCloud);
                                        setShowGDriveModal(false);
                                    } else {
                                        showToast('Token 交換失敗: ' + (tokenData.error || '未取得 Access Token'));
                                    }
                                } catch (err) {
                                    console.error('Token exchange error:', err);
                                    showToast('Token 交換連線失敗');
                                } finally {
                                    setIsSyncing(false);
                                }
                            }
                        }
                    });
                    client.requestCode();
                } catch (err) {
                    showToast('Google Auth Initialize Error');
                }
            };

            const fetchUserProfile = async (token) => {
                try {
                    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const info = await res.json();
                        setUserInfo({ name: info.name, email: info.email, picture: info.picture });
                    }
                } catch (e) {}
            };

            const handleGoogleLogout = () => {
                if (accessToken && window.google?.accounts?.oauth2) {
                    window.google.accounts.oauth2.revoke(accessToken, () => {});
                }
                setAccessToken(null);
                setUserInfo(null);
                setCloudNotes(DEFAULT_CLOUD_NOTES);
                setActiveCloudNoteId(DEFAULT_CLOUD_NOTES[0]?.id || null);
                setWorkspace('local');
                showToast(t.switchedToLocal);
            };

            const switchWorkspace = (targetWorkspace) => {
                if (targetWorkspace === 'cloud' && !accessToken) {
                    setShowGDriveModal(true);
                    return;
                }
                setWorkspace(targetWorkspace);
                showToast(targetWorkspace === 'cloud' ? t.switchedToCloud : t.switchedToLocal);
            };

            const handleKeyDownTextarea = (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const textarea = textareaRef.current;
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const value = textarea.value;
                    textarea.value = value.substring(0, start) + '  ' + value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + 2;
                    updateActiveNote({ content: textarea.value });
                }
            };

            const allTags = React.useMemo(() => {
                const tagSet = new Set();
                currentNotes.forEach(note => {
                    (note.tags || []).forEach(t => tagSet.add(t));
                });
                return Array.from(tagSet);
            }, [currentNotes]);

            const tagTree = React.useMemo(() => buildTagTree(allTags), [allTags]);

            const filteredNotes = currentNotes
                .filter(note => {
                    if (selectedTag) {
                        const noteTags = note.tags || [];
                        const matchesTag = noteTags.some(t => t === selectedTag || t.startsWith(selectedTag + '/'));
                        if (!matchesTag) return false;
                    }
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        return note.title.toLowerCase().includes(query) || note.content.toLowerCase().includes(query);
                    }
                    return true;
                })
                .sort((a, b) => {
                    if (a.isPinned !== b.isPinned) return b.isPinned ? 1 : -1;
                    return b.updatedAt - a.updatedAt;
                });

            const formatDate = (timestamp) => {
                if (!timestamp) return '';
                const date = new Date(timestamp);
                const now = new Date();
                if (date.toDateString() === now.toDateString()) {
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
                return date.toLocaleDateString([], { month: 'numeric', day: 'numeric' });
            };

            const stats = React.useMemo(() => {
                if (!activeNote || !activeNote.content) return { words: 0, chars: 0 };
                const text = activeNote.content.trim();
                const chars = text.length;
                const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
                return { words, chars };
            }, [activeNote?.content]);

            const renderedMarkdown = React.useMemo(() => {
                if (!activeNote || !activeNote.content) return { __html: '<p class="text-slate-400 italic">無內容...</p>' };
                try {
                    if (window.marked) {
                        window.marked.setOptions({ breaks: true, gfm: true });
                    }
                    const normalized = activeNote.content.replace(/\r\n/g, '\n');
                    const rawHtml = window.marked ? window.marked.parse(normalized) : normalized;
                    const cleanHtml = window.DOMPurify ? window.DOMPurify.sanitize(rawHtml) : rawHtml;
                    return { __html: cleanHtml };
                } catch (e) {
                    return { __html: '<p class="text-red-500">Markdown Parse Error</p>' };
                }
            }, [activeNote?.content]);

            const fontSizeClassMap = { sm: 'text-xs', base: 'text-sm', lg: 'text-base', xl: 'text-lg' };
            const contentWidthClassMap = { narrow: 'max-w-2xl', normal: 'max-w-4xl', wide: 'max-w-6xl', full: 'max-w-full' };

            const renderTagNode = (node) => {
                const isExpanded = expandedTags[node.fullPath];
                const isSelected = selectedTag === node.fullPath;
                const hasChildren = Object.keys(node.children).length > 0;

                const toggleExpand = (e) => {
                    e.stopPropagation();
                    setExpandedTags(prev => ({ ...prev, [node.fullPath]: !prev[node.fullPath] }));
                };

                return (
                    <div key={node.fullPath} className="ml-2">
                        <div 
                            onClick={() => setSelectedTag(isSelected ? null : node.fullPath)}
                            className={`flex items-center justify-between px-2 py-1 rounded text-xs cursor-pointer transition-colors ${
                                isSelected 
                                    ? 'bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-semibold' 
                                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                            }`}
                        >
                            <div className="flex items-center space-x-1.5 truncate">
                                {hasChildren ? (
                                    <button onClick={toggleExpand} className="p-0.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">
                                        {isExpanded ? <IconChevronDown /> : <IconChevronRight />}
                                    </button>
                                ) : (
                                    <span className="w-3 text-slate-400"><IconTag /></span>
                                )}
                                <span className="truncate">{node.name}</span>
                            </div>
                        </div>

                        {hasChildren && isExpanded && (
                            <div className="border-l border-slate-200 dark:border-slate-800 ml-2">
                                {Object.values(node.children).map(child => renderTagNode(child))}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100">
                    {/* Toast Alert */}
                    {notification && (
                        <div className="fixed bottom-5 right-5 z-50 px-4 py-2 bg-slate-800 text-white text-xs rounded-xl shadow-xl flex items-center space-x-2 animate-bounce">
                            <span>✨</span>
                            <span>{notification}</span>
                        </div>
                    )}

                    {/* SIDEBAR NAVIGATION */}
                    {!isZenMode && (
                        <aside className={`w-64 sm:w-72 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col h-full transition-all duration-300 z-20 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full absolute md:relative'}`}>
                            
                            {/* App Header & Workspace Selector */}
                            <div className="p-3 border-b border-slate-100 dark:border-slate-800/60 space-y-2">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-6 h-6 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold text-xs shadow-sm">
                                            Z
                                        </div>
                                        <span className="font-extrabold text-sm tracking-tight bg-gradient-to-r from-brand-600 to-sky-500 bg-clip-text text-transparent">
                                            ZenNotes
                                        </span>
                                    </div>
                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 font-mono">
                                        v2.0
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 gap-1 p-0.5 bg-slate-100 dark:bg-slate-800/80 rounded-lg text-xs font-medium">
                                    <button
                                        onClick={() => switchWorkspace('local')}
                                        className={`py-1 px-2 rounded-md transition-all flex items-center justify-center gap-1.5 ${
                                            workspace === 'local' 
                                                ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-sm font-semibold' 
                                                : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'
                                        }`}
                                    >
                                        <IconLaptop />
                                        <span>{t.localWorkspace}</span>
                                    </button>

                                    <button
                                        onClick={() => switchWorkspace('cloud')}
                                        className={`py-1 px-2 rounded-md transition-all flex items-center justify-center gap-1.5 ${
                                            workspace === 'cloud' 
                                                ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-sm font-semibold' 
                                                : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'
                                        }`}
                                    >
                                        <IconCloud />
                                        <span>{t.cloudWorkspace}</span>
                                    </button>
                                </div>
                            </div>

                            {/* Create Note & Import Buttons */}
                            <div className="p-3 border-b border-slate-100 dark:border-slate-800/60 space-y-2">
                                <button
                                    onClick={createNewNote}

                                    <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                                        <IconKeyboard />
                                        <span>{t.shortcutsTitle}</span>
                                    </h3>
                                    <button 
                                        onClick={() => setShowShortcutModal(false)}
                                        className="text-slate-400 hover:text-slate-600 text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-2.5 text-xs">
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-600 dark:text-slate-400">{t.shortcutNewNote}</span>
                                        <kbd className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 font-mono">Cmd/Ctrl + N</kbd>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-600 dark:text-slate-400">{t.shortcutSearch}</span>
                                        <kbd className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 font-mono">Cmd/Ctrl + F 或 /</kbd>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-600 dark:text-slate-400">{t.shortcutViewMode}</span>
                                        <kbd className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 font-mono">Cmd/Ctrl + E</kbd>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-600 dark:text-slate-400">{t.shortcutZen}</span>
                                        <kbd className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 font-mono">Cmd/Ctrl + Shift + Z</kbd>
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <button
                                        onClick={() => setShowShortcutModal(false)}
                                        className="w-full py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-medium transition-colors"
                                    >
                                        {t.confirm}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
