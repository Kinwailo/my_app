    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

  let text = line.trim();
  if (text.startsWith("|")) text = text.slice(1);
  if (text.endsWith("|")) text = text.slice(0, -1);
  return text.split("|").map((cell) => cell.trim());
}

  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2) {
      const nl = parts[i].indexOf("\n");

      else if (/^##\s/.test(block)) html += "<h2>" + inlineMd(block.replace(/^##\s+/, "")) + "</h2>";
      else if (/^#\s/.test(block)) html += "<h1>" + inlineMd(block.replace(/^#\s+/, "")) + "</h1>";
      else if (/^>\s/.test(block)) html += "<blockquote>" + inlineMd(lines.map((line) => line.replace(/^>\s?/, "")).join(" ")) + "</blockquote>";
      else if (/^---+$/.test(block.trim())) html += "<hr />";
      else if (lines.length >= 2 && lines[0].includes("|") && /^\s*\|?\s*:?-{3,}/.test(lines[1])) {

        html += "<table><thead><tr>" + head.map((cell) => "<th>" + inlineMd(cell) + "</th>").join("") + "</tr></thead><tbody>" +
          body.map((row) => "<tr>" + head.map((_, index) => "<td>" + inlineMd(row[index] || "") + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>";
      } else if (lines.every((line) => /^[-*]\s/.test(line))) html += "<ul>" + lines.map((line) => "<li>" + inlineMd(line.replace(/^[-*]\s+/, "")) + "</li>").join("") + "</ul>";
      else if (lines.every((line) => /^\d+\.\s/.test(line))) html += "<ol>" + lines.map((line) => "<li>" + inlineMd(line.replace(/^\d+\.\s+/, "")) + "</li>").join("") + "</ol>";

    }

}

    else { notes.set(loaded.id, loaded); tombs.delete(loaded.id); }
  }
  state.applying = true;
  state.notes = Array.from(notes.values());
  state.tombstones = Array.from(tombs.entries()).map(([id, at]) => ({ id, at })).slice(-500);
  if (!state.notes.some((note) => note.id === state.activeId)) state.activeId = state.notes[0] ? state.notes[0].id : null;
  state.applying = false;
  save();
  for (const item of uploads) await upsertFile(item.note || { deleted: true, id: item.id, at: item.tombAt }, item.file);
  for (const fileId of extras) await deleteFile(fileId);
  if (legacy) await deleteFile(legacy.fileId);
}
async function runSync() {
  if (!hasSession()) return;
  if (syncing) { syncQueued = true; return; }
  syncing = true;
  state.syncing = true;
  state.syncError = "";
  const seen = new Map(dirtyRev);
  paintSync();
  try {
    await syncNotes();
    seen.forEach((rev, id) => { if (dirtyRev.get(id) === rev) dirtyRev.delete(id); });
    state.syncError = "";
  } catch (error) {
    state.syncError = error.message || "同步失敗";
    showToast(state.syncError, false);
  } finally {
    syncing = false;
    state.syncing = false;
    paintSync();
    render();
    if (syncQueued) { syncQueued = false; runSync(); }
  }
}
function syncNow() { clearTimeout(syncTimer); syncTimer = 0; runSync(); }
async function connect() {
  state.syncError = "";
  try { await signIn(); await runSync(); }
  catch (error) { state.syncError = error.message || "連線失敗"; showToast(state.syncError, false); render(); }
}
function disconnect() {
  clearTimeout(syncTimer); syncTimer = 0;
  writeTokens(null);
  dirtyRev.clear();
  state.syncError = "";
  render();
}

let toastTimer = 0;
function showToast(message, withUndo) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.innerHTML = esc(message) + (withUndo ? ' <button type="button" id="toast-undo">' + esc(t("undo")) + "</button>" : "");
  const button = document.getElementById("toast-undo");
  if (button) button.onclick = () => undo();

  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { document.getElementById("toast").hidden = true; }
function paintSync() {
  const on = hasSession();
  document.querySelectorAll("[data-dot]").forEach((el) => {
    const id = el.getAttribute("data-dot");
    const dirty = on && (id === "*" ? dirtyRev.size > 0 || !!state.syncError : dirtyRev.has(id));
    if (!on) { el.hidden = true; return; }
    el.hidden = false;
    const pulsing = state.syncing && (id === "*" || dirtyRev.has(id));
    el.innerHTML = '<span class="dot ' + (!dirty || pulsing ? "ok" : "bad") + (pulsing ? " pulse" : "") + '"></span>';
    el.title = pulsing ? t("syncing") : dirty ? t("unsynced") : t("synced");

}
function dotHtml(id) { return '<button type="button" class="dot-btn" data-dot="' + esc(id) + '" hidden></button>'; }

function render(opts) {

      (note ? '<div class="toolbar-row"><div class="tag-slot-mob">' + (desktop() ? "" : tagFields) + '</div><div class="view-switch" role="radiogroup">' + viewButtons + "</div>" + choices + "</div>" : "") + "</header>";

    [t("search"), "K"],

    [state.locale === "en" ? "Show or hide sidebar" : "顯示或隱藏側邊欄", "B"],

  document.getElementById("app").innerHTML =

    '<aside class="sidebar ' + (showSidebar ? "" : "closed") + '"><div class="brand"><div class="brand-text"><h1>墨箋</h1><p class="brand-sub">' + esc(connected ? t("cloud") : t("local")) + (connected ? dotHtml("*") : "") + '</p></div><button class="icon-btn close-mobile" data-act="close-sidebar" aria-label="' + esc(t("close")) + '">' + icon.x + '</button><button class="icon-btn" data-act="import" aria-label="' + esc(t("importHtml")) + '">' + icon.up + '</button><button class="icon-btn" data-act="new" aria-label="' + esc(t("newNote")) + '">' + icon.plus + '</button></div><div class="search-wrap">' + icon.search + '<input id="search" type="search" placeholder="' + esc(t("search")) + '" value="' + esc(state.search) + '" /></div>' + chips + '<div class="list">' + listHtml + '</div><div class="side-foot"><button class="text-btn" data-act="login">' + (connected ? icon.out : icon.in) + esc(connected ? t("logout") : t("login")) + '</button><span class="grow"></span><button class="icon-btn" data-act="help" aria-label="' + esc(t("help")) + '">' + icon.keys + '</button><button class="icon-btn" data-act="lang" aria-label="language">' + (state.locale === "zh" ? "EN" : "中") + '</button><button class="icon-btn" data-act="theme" aria-label="theme">' + (state.theme === "dark" ? icon.sun : icon.moon) + "</button></div></aside>" +

  bind();

function bind() {
  document.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", (event) => {
    if (el.getAttribute("data-stop")) return;
    const act = el.getAttribute("data-act");
    if (act === "new") createNote();
    if (act === "import") document.getElementById("import-file").click();
    if (act === "sidebar") { state.sidebarOpen = !state.sidebarOpen; state.focusMode = false; render(); }
    if (act === "close-sidebar") { state.sidebarOpen = false; render(); }
    if (act === "focus") { state.focusMode = !state.focusMode; state.sidebarOpen = !state.focusMode; render(); }
    if (act === "help") { state.shortcuts = !state.shortcuts; render(); }
    if (act === "lang") { state.locale = state.locale === "zh" ? "en" : "zh"; savePrefs(); render(); }
    if (act === "theme") { state.theme = state.theme === "dark" ? "light" : "dark"; savePrefs(); render(); }
    if (act === "login") { if (hasSession()) disconnect(); else connect(); }
    event.stopPropagation();
  }));
  document.querySelectorAll("[data-stop]").forEach((el) => el.addEventListener("click", (event) => event.stopPropagation()));
  document.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => { state.activeId = el.getAttribute("data-open"); if (!desktop()) state.sidebarOpen = false; save(); render(); }));
  document.querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); deleteNote(el.getAttribute("data-del")); }));
  document.querySelectorAll("[data-dl]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); const note = state.notes.find((item) => item.id === el.getAttribute("data-dl")); if (note) downloadNote(note); }));
  document.querySelectorAll("[data-view]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); setView(el.getAttribute("data-view")); }));
  document.querySelectorAll("[data-font]").forEach((el) => el.addEventListener("click", () => { state.font = el.getAttribute("data-font"); savePrefs(); render(); }));
  document.querySelectorAll("[data-width]").forEach((el) => el.addEventListener("click", () => { state.width = el.getAttribute("data-width"); savePrefs(); render(); }));
  document.querySelectorAll("[data-tag]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); const tag = el.getAttribute("data-tag") || ""; state.tagFilter = state.tagFilter === tag ? "" : tag; state.subtagFilter = ""; render(); }));
  document.querySelectorAll("[data-sub]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); const sub = el.getAttribute("data-sub") || ""; state.subtagFilter = state.subtagFilter === sub ? "" : sub; render(); }));
  document.querySelectorAll("[data-dot]").forEach((el) => el.addEventListener("click", (event) => { event.stopPropagation(); if (!el.disabled) syncNow(); }));
  const titleInput = document.getElementById("title-input");
  if (titleInput && active()) {
    titleInput.addEventListener("input", () => {
      const note = active();
      note.title = titleInput.value.slice(0, 80); note.titleCustom = true; note.updatedAt = Date.now(); markDirty(note.id); save();
      const heading = document.querySelector(".note-item.active h3"); if (heading) heading.textContent = displayTitle(note);
    });
    titleInput.addEventListener("blur", () => {
      const note = active(); if (!note) return;
      const trimmed = note.title.trim().slice(0, 80);
      if (!trimmed) { note.title = titleFrom(note.content); note.titleCustom = false; } else note.title = trimmed;
      save(); render();
    });
  }
  const tagInput = document.getElementById("tag-input");
  const subtagInput = document.getElementById("subtag-input");
  function touchTags(blur) {
    const note = active(); if (!note) return;
    if (tagInput) note.tag = tagInput.value.slice(0, 24);
    if (subtagInput) note.subtag = note.tag.trim() ? subtagInput.value.slice(0, 24) : "";
    if (blur) { note.tag = note.tag.trim(); note.subtag = note.tag ? note.subtag.trim() : ""; }
    note.updatedAt = Date.now(); markDirty(note.id); save();
    if (subtagInput) subtagInput.disabled = !note.tag.trim();
    if (blur) render();

  if (tagInput) { tagInput.addEventListener("input", () => touchTags(false)); tagInput.addEventListener("blur", () => touchTags(true)); }
  if (subtagInput) { subtagInput.addEventListener("input", () => touchTags(false)); subtagInput.addEventListener("blur", () => touchTags(true)); }

  if (search) search.addEventListener("input", () => { state.search = search.value; render(); const next = document.getElementById("search"); if (next) { next.focus(); next.setSelectionRange(state.search.length, state.search.length); } });
  const editor = document.getElementById("editor");
  if (editor) {
    editor.addEventListener("input", () => {
      const note = active(); if (!note) return;
      note.content = editor.value;
      if (!note.titleCustom) note.title = titleFrom(note.content);
      note.updatedAt = Date.now(); markDirty(note.id); save();
      const item = document.querySelector(".note-item.active");
      if (item) { item.querySelector("h3").textContent = displayTitle(note); item.querySelector(".snip").textContent = snippetFrom(note.content) || t("blank"); item.querySelector("time").textContent = relTime(note.updatedAt); }
      const title = document.getElementById("title-input");
      if (title && document.activeElement !== title) title.value = note.title;
      const preview = document.querySelector(".prose");
      if (preview) preview.innerHTML = renderMd(note.content);
      const status = document.querySelector(".status span");
      if (status) status.textContent = countWords(note.content) + " " + t("words") + "　/　" + t("edited") + " " + relTime(note.updatedAt);
    });
    editor.addEventListener("keydown", (event) => {
      if (event.key !== "Tab") return;
      event.preventDefault();

      editor.dispatchEvent(new Event("input"));
    });
  }
}
document.getElementById("import-file").addEventListener("change", (event) => {
  const files = event.target.files;
  event.target.value = "";
  if (files && files.length) importHtmlFiles(files);
});
document.addEventListener("keydown", (event) => {
  const target = event.target;
  const inField = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA");
  const meta = event.metaKey || event.ctrlKey;
  if (event.key === "Escape") {
    if (state.shortcuts) { state.shortcuts = false; render(); return; }
    if (state.focusMode) { state.focusMode = false; state.sidebarOpen = true; render(); return; }
    if (!desktop() && state.sidebarOpen) { state.sidebarOpen = false; render(); }
    return;
  }
  if (!inField && event.key === "?") { event.preventDefault(); state.shortcuts = !state.shortcuts; render(); return; }
  if (!inField && event.key === "/" && !meta) { event.preventDefault(); state.sidebarOpen = true; render(); const search = document.getElementById("search"); if (search) search.focus(); return; }
  if (!meta) {
    if (!inField && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
      const notes = filtered();

      event.preventDefault();
      const index = Math.max(0, notes.findIndex((note) => note.id === state.activeId));
      const next = notes[Math.min(notes.length - 1, Math.max(0, index + (event.key === "ArrowDown" ? 1 : -1)))];
      if (next) { state.activeId = next.id; save(); render(); }
    }

  }
  const key = event.key.toLowerCase();
  if (key === "n") { event.preventDefault(); createNote(); }
  if (key === "k") { event.preventDefault(); state.sidebarOpen = true; render(); const search = document.getElementById("search"); if (search) search.focus(); }
  if (key === "e") { event.preventDefault(); cycleView(); }
  if (key === "b") { event.preventDefault(); state.sidebarOpen = !state.sidebarOpen; state.focusMode = false; render(); }
  if (event.key === "\\") { event.preventDefault(); state.focusMode = !state.focusMode; state.sidebarOpen = !state.focusMode; render(); }
  if (event.key === "Backspace" && (!inField || event.shiftKey) && active()) { event.preventDefault(); deleteNote(active().id); }
});
window.addEventListener("resize", () => render());
savePrefs();
render();
